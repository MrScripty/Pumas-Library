# cargo-deny policy for the Rust workspace (`rust/Cargo.lock`).
#
# CI runs `cargo deny --manifest-path rust/Cargo.toml check --config
# rust/deny.toml advisories licenses` in the `dependency-audit` job: advisory
# on pull requests, blocking on version tags and candidate dispatches. See
# docs/SECURITY.md#dependency-scans for how results are reviewed.

[graph]
# The three desktop/headless release targets in scripts/release/artifact-plan.json.
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
]
# Every optional feature (S3, bindings, test support) is scanned, so a
# feature-gated dependency cannot hide from the release review.
all-features = true

[advisories]
# Advisories come from the RustSec database at scan time. An accepted
# advisory is listed here only with the reason recorded in
# docs/SECURITY.md#accepted-advisory-exceptions; drop it when the dependency
# changes.
ignore = [
  # lru 0.16.4 through aws-sdk-s3 (s3 builds only). The trigger is absent: the
  # key is a String with no custom Drop and `pop` is never called.
  { id = "RUSTSEC-2026-0253", reason = "S3-only; trigger absent (see docs/SECURITY.md)" },
]
# Unmaintained crates are reported but do not fail the scan: an unmaintained
# notice is not a vulnerability, and SECURITY.md records each one in use.
unmaintained = "none"
# Unsound notices are reported for transitive crates too (the default only
# covers direct dependencies of workspace crates).
unsound = "all"
yanked = "warn"

[licenses]
# Derived from the licenses declared by the shipped dependency closure
# (docs/release-attribution/<version>/inventory.json) plus the workspace's
# build-only and binding dependencies. Adding a license here is a licensing
# decision: record it with the release's attribution review.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "bzip2-1.0.6",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are MIT (rust/Cargo.toml) and are not published.
ignore = true
