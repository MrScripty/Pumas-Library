name: Windows process lifetime verification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          key: windows-native-debug
          cache-on-failure: true
      - name: Process lifetime regression
        run: cargo test --locked --manifest-path rust/Cargo.toml -p pumas-library --features test-support,uniffi --lib platform::process::tests -- --nocapture
      - name: Repeated crash recovery integration
        run: |
          for ($i = 0; $i -lt 10; $i++) {
            cargo test --locked --manifest-path rust/Cargo.toml -p pumas-library --test intent_desired_crash_tests -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Full native Windows workspace tests
        run: cargo test --locked --manifest-path rust/Cargo.toml --workspace --exclude pumas_rustler --no-fail-fast
