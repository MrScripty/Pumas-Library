# Optional local checks for early contributor feedback
# Install: pre-commit install --hook-type pre-commit --hook-type commit-msg
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

repos:
  # Project commit-subject policy
  - repo: local
    hooks:
      - id: check-commit-message
        name: Check commit message format
        entry: scripts/dev/check-commit-message.sh
        language: system
        stages: [commit-msg]

  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        # Preserve verbatim upstream legal texts and hash-pinned archive evidence.
        exclude: ^(scripts/release/licenses/|docs/release-attribution/|docs/plans/torch-cross-platform-runtime-management/reports/managed-python-license-collection/.*/managed-python-licenses/full-archive/)
      - id: end-of-file-fixer
        exclude: ^(scripts/release/licenses/|docs/release-attribution/|docs/plans/torch-cross-platform-runtime-management/reports/managed-python-license-collection/.*/managed-python-licenses/full-archive/)
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-json
        exclude: ^(frontend/|\.vscode/)
      - id: detect-private-key
