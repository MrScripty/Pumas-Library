name: Windows native verification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          key: windows-native-debug
          cache-on-failure: true
      - name: Check Windows warnings
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked --manifest-path rust/Cargo.toml --workspace --exclude pumas_rustler --all-targets
      - name: All Windows Rust tests
        id: tests
        continue-on-error: true
        run: cargo test --locked --manifest-path rust/Cargo.toml --workspace --exclude pumas_rustler --no-fail-fast
      - name: Native backend startup
        if: always() && steps.tests.outcome != 'skipped'
        run: python scripts/release/smoke-rpc.py rust/target/debug/pumas-rpc.exe
      - name: Require tests to pass
        if: always() && steps.tests.outcome != 'success'
        run: exit 1
