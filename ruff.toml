line-length = 100
target-version = "py312"

exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "__pycache__",
  "build",
  "dist",
  "venv",
]

[lint]
# Ruff 0.17 widened its default rule set; keep the long-standing defaults explicit.
select = ["E4", "E7", "E9", "F"]

[format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
