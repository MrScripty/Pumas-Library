[package]
name = "pumas-library"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless library for Pumas model and version management"
keywords = ["ai", "models", "library", "huggingface", "model-management"]
categories = ["database", "filesystem"]
readme = "README.md"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util", "fs", "process", "macros"] }

# HTTP client
# This consumer uses the explicit retry policy API; keep its tested minimum here.
reqwest = { version = "0.12.28", features = ["json", "stream"] }
bytes = { workspace = true }

# Database
rusqlite = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { version = "=1.2.0", optional = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# System information
sysinfo = { workspace = true }

# Cross-platform signal handling
ctrlc = { workspace = true }

# File operations
tempfile = { workspace = true }
walkdir = { workspace = true }
fs2 = { workspace = true }

# Portable logical-path collision comparison
unicode-normalization = "=0.1.25"

# Archive extraction
flate2 = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }

# Hashing
sha2 = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }

# URL encoding
urlencoding = { workspace = true }

# Async utilities
futures = { workspace = true }
async-trait = { workspace = true }

# ONNX Runtime embedding execution
half = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

# URL handling
url = { workspace = true }

# Semver parsing
semver = { workspace = true }

# Regex
regex = { workspace = true }

# Time handling
chrono = { workspace = true }

# TTL Cache
mini-moka = { workspace = true }

# Rate limiting
governor = { workspace = true }

# UUID generation
uuid = { workspace = true }

# Random number generation
rand = "0.9"

# Directory utilities (home dir, etc.)
dirs = { workspace = true }
cap-std = { workspace = true }
cap-primitives = { workspace = true }

# File system watching
notify = { workspace = true }

# Explicit, optional S3 reader; no default SDK filesystem or other cloud backends.
object_store = { version = "=0.12.4", default-features = false, features = ["aws"], optional = true }

# Cross-language bindings (optional)
uniffi = { workspace = true, optional = true }

# Atomic non-replacing moves; non-reaping process observation on Linux.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.3", features = ["fs", "process"] }

# Platform-specific: Unix
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
libc = { workspace = true }

# Platform-specific: Windows
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

# Safe FIFO construction for isolated Unix test children; no product feature change.
[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
# Loopback TLS redirect regression only; already locked by reqwest.
native-tls = "=0.2.14"
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[features]
contract-schema = ["dep:schemars"]
default = ["full"]
full = ["hf-client", "process-manager", "gpu-monitor", "onnx-runtime"]
onnx-runtime = ["dep:half", "dep:ort", "dep:tokenizers"]
hf-client = []       # HuggingFace model search & download
test-support = ["hf-client"] # Explicit integration-fixture admission; not a runtime importer
process-manager = [] # Inference runtime process management
gpu-monitor = []     # GPU monitoring via nvidia-smi
uniffi = ["dep:uniffi"]  # Cross-language bindings via UniFFI
s3 = ["dep:object_store"] # Explicit anonymous, version-bound object reads

[lints]
workspace = true
