[package]
name = "pumas-rpc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "JSON-RPC server with the Pumas library compiled in; one binary serves the full library over HTTP"
publish = false

[[bin]]
name = "pumas-rpc"
path = "src/main.rs"

[dependencies]
# Internal crates
pumas-library = { workspace = true, default-features = false, features = ["hf-client"] }
pumas-app-manager = { workspace = true, optional = true }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "net", "macros", "signal"] }

# HTTP server
axum = { workspace = true }
tower = { workspace = true, features = ["limit"] }
tower-http = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { version = "=1.2.0", optional = true }
tempfile = { workspace = true, optional = true }
futures = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Filesystem paths
dirs = { workspace = true }

# URL parsing
url = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# HTTP client (for plugin health checks)
reqwest = { workspace = true }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

[features]
export-contract = ["dep:schemars", "dep:tempfile", "pumas-library/contract-schema"]
default = ["inference-plugins"]
inference-plugins = [
    "dep:pumas-app-manager",
    "pumas-library/onnx-runtime",
    "pumas-library/process-manager",
    "pumas-library/gpu-monitor",
]

[dev-dependencies]
pumas-library = { workspace = true, default-features = false, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = { workspace = true }

[lints]
workspace = true
