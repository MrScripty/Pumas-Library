[package]
name = "pumas-s3-sdk-owner-spike"
version = "0.0.0"
edition = "2021"
rust-version = "1.92"
publish = false

# Independent suitability experiment; not a production workspace member.
[workspace]
resolver = "3"

[dependencies]
aws-sdk-s3 = { version = "=1.137.0", default-features = false, features = ["rt-tokio", "http-1x"] }
aws-credential-types = "=1.2.14"
aws-smithy-runtime-api = { version = "=1.12.3", features = ["client", "http-1x"] }
aws-smithy-types = { version = "=1.5.0", features = ["http-body-1-x"] }

[dev-dependencies]
roxmltree = "=0.21.1"
reqwest = { version = "=0.12.28", features = ["stream"] }
tokio = { version = "=1.49.0", features = ["macros", "rt", "net", "io-util", "time"] }
http = "=1.4.0"
http-body = "=1.0.1"
http-body-util = "=0.1.3"
futures = "=0.3.31"
sha2 = "=0.10.9"
hex = "=0.4.3"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.22"
rcgen = "=0.14.10"
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
